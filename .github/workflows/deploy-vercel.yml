name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Astro build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Link Vercel project
        run: npx vercel@58.4.0 link --yes --project dimsamkuy --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Pull production settings
        run: npx vercel@58.4.0 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build for Vercel
        run: npx vercel@58.4.0 build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production
        run: npx vercel@58.4.0 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
